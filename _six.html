<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>six-webview2 (skeleton)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="256x256" href="256x256.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="512x512.png" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="1024x1024.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="512x512.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="_six.css" />
  <script src="_six-theme.js"></script>
  <style>
    body{ background: var(--bodyBGColor, #0b0d12); }
  </style>
</head>
<body>
  <div id="tabbar"><div class="tabs"></div></div>
  <div id="pane">
    <div id="editorViewport">
      <div id="editWrap">
        <div id="gutter"></div>
  <textarea id="editor" spellcheck="false" autofocus></textarea>
        <div id="caretLayer"></div>
        <div id="edstripe" style="display:none"></div>
      </div>
    </div>
  </div>
  <div id="cmdbar"><span id="modestatus">[NORMAL]</span><span id="cmdprefix"></span><input id="cmdinput" type="text" spellcheck="false" placeholder="command" /></div>

  <div id="bufpopup" style="display:none">
    <div class="inner"></div>
  </div>

  <div id="toast" style="display:none"><span class="msg"></span></div>

  <!-- modal (custom confirm/choice) -->
  <div id="modalOverlay" role="dialog" aria-modal="true" style="display:none">
    <div id="modalBox">
      <div class="modal-body">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-detail" id="modalDetail"></div>
      </div>
      <div class="modal-buttons" id="modalButtons"></div>
    </div>
  </div>

  <!-- boot sentinel: shows if JS bootstrap didn't run -->
  <div id="bootwarn" style="display:none;position:fixed;left:8px;bottom:8px;z-index:99999;padding:6px 10px;border-radius:4px;background:#3b1f1f;color:#ffdede;font:12px/1.4 system-ui, sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>
  <script>
    // If _six.js didn't initialize within ~1.8s, show a small hint.
    setTimeout(function(){
      try{
        if (!window.six){
          var el = document.getElementById('bootwarn');
          if (el){
            el.style.display='';
            if (window.__sixLoadError){
              el.textContent = 'six: _six.js の読み込みに失敗しました。ファイルの場所/権限/パスを確認してください。';
            } else {
              el.textContent = 'six: JavaScript の初期化に失敗しました。F12でコンソールを開き、Ctrl+F5 で再読込してください。';
            }
          }
        }
      }catch{}
    }, 1800);
  </script>

  <script id="sixjs" src="_six.js" onload="try{window.__sixLoaded=true; var bw=document.getElementById('bootwarn'); if(bw) bw.style.display='none';}catch{}" onerror="(function(){window.__sixLoadError=true; var el=document.getElementById('bootwarn'); if(el){ el.style.display=''; el.textContent='six: _six.js の読み込みに失敗しました（ファイル参照/権限/パスを確認）'; }})()"></script>
</body>
</html>
