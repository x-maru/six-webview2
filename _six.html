<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>six-webview2 (skeleton)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="256x256" href="256x256.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="512x512.png" />
  <link rel="icon" type="image/png" sizes="1024x1024" href="1024x1024.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="512x512.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="_six.css" />
  <!-- customization (theme + initial :set options) -->
  <script src="_six.customize"></script>
  <style>
    body{ background: var(--bodyBGColor, #0b0d12); }
  </style>
</head>
<body>
    <div id="tabbar">
    <div class="tabscroll" id="tabScrollLeft" title="Scroll tabs left"><span>◀</span></div>
    <div class="tabs"></div>
    <div class="tabscroll" id="tabScrollRight" title="Scroll tabs right"><span>▶</span></div>
    <div id="tabtools">
      <span id="modestatus" title="モード">[NORMAL]</span>
      <span id="posinfo" title="カーソル位置"></span>
      <!-- zoom HUD (inline in tabbar; always visible) -->
    </div>
  </div>
  <div id="pane">
    <div id="editorViewport">
      <div id="editWrap">
        <div id="gutter"></div>
  <textarea id="editor" spellcheck="false" autofocus></textarea>
        <div id="caretLayer"></div>
        <div id="edstripe" style="display:none"></div>
        <!-- Floating command bar (dynamic position near caret; hidden by default) -->
        <div id="cmdfloat" style="display:none"><span id="cmdprefix"></span><input id="cmdinput" type="text" spellcheck="false" /></div>
      </div>
    </div>
  </div>
  <!-- Legacy fixed bottom command bar removed in favor of floating cmdfloat (#532) -->

  <div id="bufpopup" style="display:none">
    <div class="inner"></div>
  </div>

  <div id="encpopup" style="display:none">
    <div class="inner"></div>
  </div>

  <div id="toast" style="display:none"><span class="msg"></span></div>

  <!-- palette toggle button (always visible; outside overlayPalette) -->
  <button id="paletteToggleBtn" type="button" title="オーバーレイパレット表示/非表示 (Ctrl+F9)" style="position:fixed; right:12px; bottom:6px; z-index:10001; display:flex; align-items:center; font:11px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif; padding:4px 8px; border:1px solid #2a3244; background:#1a2030; color:#e6e6e6; border-radius:6px; cursor:pointer; user-select:none; line-height:1.2;">
    <span style="display:inline-block; filter: grayscale(100%);">🎨</span><span style="display:inline-block; margin-left:6px;">^F9</span>
  </button>

  

  <!-- modal (custom confirm/choice) -->
  <div id="modalOverlay" role="dialog" aria-modal="true" style="display:none">
    <div id="modalBox">
      <div class="modal-body">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-detail" id="modalDetail"></div>
      </div>
      <div class="modal-buttons" id="modalButtons"></div>
    </div>
  </div>

  <!-- boot sentinel: shows if JS bootstrap didn't run -->
  <div id="bootwarn" style="display:none;position:fixed;left:8px;bottom:8px;z-index:99999;padding:6px 10px;border-radius:4px;background:#3b1f1f;color:#ffdede;font:12px/1.4 system-ui, sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>
  <script>
    // If _six.js didn't initialize within ~1.8s, show a small hint.
    setTimeout(function(){
      try{
        if (!window.six){
          var el = document.getElementById('bootwarn');
          if (el){
            el.style.display='';
            if (window.__sixLoadError){
              el.textContent = 'six: _six.js の読み込みに失敗しました。ファイルの場所/権限/パスを確認してください。';
            } else {
              el.textContent = 'six: JavaScript の初期化に失敗しました。F12でコンソールを開き、Ctrl+F5 で再読込してください。';
            }
          }
        }
      }catch{}
    }, 1800);
  </script>

  <script id="sixjs" src="_six.js?v=0.9.1.j" onload="try{window.__sixLoaded=true; var bw=document.getElementById('bootwarn'); if(bw) bw.style.display='none';}catch{}" onerror="(function(){window.__sixLoadError=true; var el=document.getElementById('bootwarn'); if(el){ el.style.display=''; el.textContent='six: _six.js の読み込みに失敗しました（ファイル参照/権限/パスを確認）'; }})()"></script>
</body>
</html>
